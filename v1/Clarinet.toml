# The pool as it is deployed on testnet today.
#
# Every contract here is byte-for-byte what `STFCGF789WX1B737VQYAQ6BG3QYVMJGPDJN4TJFM`
# published, modulo the per-network address and name rewrites that
# `scripts/build-network.mjs` applies on the way out -- the pool itself is
# published there as `vault-1`.
#
# Kept so the running system and the one in ../contracts/ can be run and
# diffed side by side. `v1/README.md` says what the difference is.
#
# `bond-bridge` and `esbee-dao` are here for the same reason as the two above:
# the pool they call is this one. Note that this `bond-bridge` is the smaller,
# earlier ramp -- the one on testnet today -- not the `bond-bridge` in
# ../contracts/, which is the rewritten one the current pool uses.

[project]
name = "sbtc-pool-bond-staker-v1"
description = "Pooled sBTC + STX staker for pox-5 Bitcoin Staking Bonds -- archived v1"
authors = []
telemetry = false
# Shared with the main project rather than re-fetched: the sBTC requirements
# below are the same contracts.
cache_dir = "../.cache"
requirements = [
    {contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal'},
    {contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit'}
]

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

# Signer managers, for tests only: a bond participant has to stake through a
# registered pox-5 signer. Sourced from the sibling fastpool-pox-5 project.
[contracts.fastpool-signer-manager]
path = "../../fastpool-pox-5/contracts/fastpool-signer-manager.clar"
clarity_version = 6
epoch = "4.0"

[contracts.signer-manager]
path = "../../fastpool-pox-5/contracts/signer-manager.clar"
clarity_version = 6
epoch = "4.0"

# Holds the pooled sBTC principal. Must be deployed before `bond-staker`,
# which calls it; its own reference back is only a principal value.
[contracts.bond-treasury]
path = "contracts/bond-treasury.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bond-staker]
path = "contracts/bond-staker.clar"
clarity_version = 6
epoch = "4.0"

# The L1 on- and off-ramp. Deployed last: it calls the two above, and neither
# calls it.
[contracts.bond-bridge]
path = "contracts/bond-bridge.clar"
clarity_version = 6
epoch = "4.0"

# The pool's operator, held by its members. Deployed after `bond-staker`, which
# it calls; `bond-staker` does not know about it.
[contracts.esbee-dao]
path = "contracts/esbee-dao.clar"
clarity_version = 6
epoch = "4.0"
