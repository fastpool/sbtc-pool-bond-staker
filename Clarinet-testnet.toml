# Manifest for deploying to testnet.
#
# Points at build/testnet/, whose sBTC and pox-5 addresses have been rewritten
# for the network by `pnpm run build:testnet`. Regenerate that first; deploying
# the sources in contracts/ would point every sBTC call at a contract that does
# not exist on testnet.
#
#   pnpm run build:testnet
#   pnpm run plan:testnet ST3YOUR…DEPLOYER
#   clarinet deployments apply --testnet --manifest-path Clarinet-testnet.toml \
#     --deployment-plan-path deployments/testnet-plan.yaml
#
# What is actually published, and under which names, comes from that plan.
# This file is the project context around it.
#
# If the pool is ever built under other names -- `build:testnet -- --staker-name
# vault-4 --suffix -4`, to match a grant that spells something else -- the six
# `[contracts.*]` sections below have to be renamed to match, both in their
# headers and in their paths. The plan generator takes the same flags.
#
[project]
name = "sbtc-pool-bond-staker"
description = "Pooled sBTC + STX staker for pox-5 Bitcoin Staking Bonds"
authors = []
telemetry = false
cache_dir = "./.cache"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

# Every contract here carries a `-3`, because a contract name can never be
# reused at an address and two whole deployments -- `vault-1` with its three
# unsuffixed siblings, `vault-2` with its `-2` ones -- are already published.
# `build:testnet` appends the suffix and rewrites every reference between them;
# nothing in `contracts/` changes.
#
# Holds the pooled sBTC principal. Must be deployed before the pool, which
# calls it; its own reference back is only a principal value.
[contracts.bond-treasury-3]
path = "build/testnet/bond-treasury-3.clar"
clarity_version = 6
epoch = "4.0"

# The pool. Published as `vault-3` on testnet: pox-5 keys a bond's allowlist
# grant on the staker's principal, so the name is whatever the grant spells,
# and `build:testnet` names the contract to match. The existing grants spell
# `vault-1` and `vault-2`, and both names carry earlier pools -- so `vault-3`
# needs a grant of its own on a bond not yet set up. See TESTNET.md.
# Receipt tokens for a member's principal, minted and burned by the pool.
# Deployed before it; their reference back is only a principal value.
[contracts.iou-bond-btc-3]
path = "build/testnet/iou-bond-btc-3.clar"
clarity_version = 6
epoch = "4.0"

[contracts.iou-bond-stx-3]
path = "build/testnet/iou-bond-stx-3.clar"
clarity_version = 6
epoch = "4.0"

[contracts.vault-3]
path = "build/testnet/vault-3.clar"
clarity_version = 6
epoch = "4.0"

# The L1 on- and off-ramp. It calls the pool and the treasury; neither calls it.
[contracts.bond-bridge-3]
path = "build/testnet/bond-bridge-3.clar"
clarity_version = 6
epoch = "4.0"

# The pool's operator, held by its members. Deployed after the pool, which it
# calls; the pool does not know about it, and is initialized with the deployer
# as operator -- the DAO is seated afterwards with `update-operator`.
[contracts.esbee-dao-3]
path = "build/testnet/esbee-dao-3.clar"
clarity_version = 6
epoch = "4.0"
