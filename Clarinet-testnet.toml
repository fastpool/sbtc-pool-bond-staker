# Manifest for deploying to testnet.
#
# Points at build/testnet/, whose sBTC and pox-5 addresses have been rewritten
# for the network by `pnpm run build:testnet`. Regenerate that first; deploying
# the sources in contracts/ would point every sBTC call at a contract that does
# not exist on testnet.
#
#   pnpm run build:testnet
#   pnpm run plan:testnet ST3YOUR…DEPLOYER
#   clarinet deployments apply --testnet --manifest-path Clarinet-testnet.toml \
#     --deployment-plan-path deployments/testnet-plan.yaml
#
# What is actually published, and under which names, comes from that plan.
# This file is the project context around it.
#
# If the pool is ever built under another name -- `build:testnet -- --staker-name
# vault-3`, to match a grant that spells something else -- the `[contracts.vault-1]`
# section below has to be renamed to match, both in its header and in its path.
# The plan generator takes the same flag.
#
[project]
name = "sbtc-pool-bond-staker"
description = "Pooled sBTC + STX staker for pox-5 Bitcoin Staking Bonds"
authors = []
telemetry = false
cache_dir = "./.cache"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

# Holds the pooled sBTC principal. Must be deployed before the pool, which
# calls it; its own reference back is only a principal value.
[contracts.bond-treasury]
path = "build/testnet/bond-treasury.clar"
clarity_version = 6
epoch = "4.0"

# The pool. Published as `vault-1` on testnet, because that is the name the
# bonds' allowlist grants spell -- pox-5 keys a grant on the staker's principal,
# and `build:testnet` names the contract to match.
[contracts.vault-1]
path = "build/testnet/vault-1.clar"
clarity_version = 6
epoch = "4.0"

# The L1 on- and off-ramp. It calls the two above, and neither calls it.
[contracts.bond-bridge]
path = "build/testnet/bond-bridge.clar"
clarity_version = 6
epoch = "4.0"

# The pool's operator, held by its members. Deployed after the pool, which it
# calls; the pool does not know about it, and is initialized with the deployer
# as operator -- the DAO is seated afterwards with `update-operator`.
[contracts.esbee-dao]
path = "build/testnet/esbee-dao.clar"
clarity_version = 6
epoch = "4.0"
