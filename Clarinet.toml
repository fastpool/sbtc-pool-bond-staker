[project]
name = "sbtc-pool-bond-staker"
description = "Pooled sBTC + STX staker for pox-5 Bitcoin Staking Bonds"
authors = []
telemetry = false
cache_dir = "./.cache"
requirements = [
    {contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-withdrawal'},
    # Needed for the `sbtc_balance` entries in settings/Devnet.toml to be
    # minted into simnet accounts: sbtc-deposit is the protocol contract that
    # performs that genesis mint. Without it every account holds 0 sBTC and no
    # deposit or reward test can run.
    {contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-deposit'}
]

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

[contracts]

# Signer managers, for tests only: pox-5 will not register a staker for a bond
# except through a registered signer manager. Two of them, because the pool
# vets managers by code hash and can be moved between them, so the tests need a
# second that is a different implementation rather than a second copy.
#
# Both are vendored under `tests/contracts/`, which is what makes `pnpm test`
# depend on nothing but this checkout -- see `scripts/build-test-managers.mjs`
# for where each came from and how to refresh it.
#
# The one the pool stakes through is the manager it will stake through on
# mainnet: the published `fastpool-max500-signer-manager`, boot address
# rewritten for simnet.
[contracts.fastpool-max500-signer-manager]
path = "tests/contracts/fastpool-max500-signer-manager.clar"
clarity_version = 6
epoch = "4.0"

# ...and v1 is the alternate to move to.
[contracts.fastpool-signer-manager]
path = "tests/contracts/fastpool-signer-manager.clar"
clarity_version = 6
epoch = "4.0"


# Stands in for pox-5's custody of the staked sBTC, for fuzzing only. It is
# reached solely from `bond-staker`'s `#[env(simnet)]` section, which is
# stripped from every network build -- so it is deployed here and nowhere else.
[contracts.bond-escrow]
path = "rendezvous/bond-escrow.clar"
clarity_version = 6
epoch = "4.0"

# Holds the pooled sBTC principal. Must be deployed before `bond-staker`,
# which calls it; its own reference back is only a principal value.
[contracts.bond-treasury]
path = "contracts/bond-treasury.clar"
clarity_version = 6
epoch = "4.0"

# Receipt tokens for a member's principal. Deployed before `bond-staker`, which
# mints and burns them; their reference back is only a principal value.
[contracts.iou-bond-btc]
path = "contracts/iou-bond-btc.clar"
clarity_version = 6
epoch = "4.0"

[contracts.iou-bond-stx]
path = "contracts/iou-bond-stx.clar"
clarity_version = 6
epoch = "4.0"

[contracts.bond-staker]
path = "contracts/bond-staker.clar"
clarity_version = 6
epoch = "4.0"

# The L1 on- and off-ramp. Deployed last: it calls the two above, and neither
# calls it.
[contracts.bond-bridge]
path = "contracts/bond-bridge.clar"
clarity_version = 6
epoch = "4.0"

# The pool's operator, held by its members. Deployed after `bond-staker`, which
# it calls; `bond-staker` does not know about it.
[contracts.esbee-dao]
path = "contracts/esbee-dao.clar"
clarity_version = 6
epoch = "4.0"

# A manager that calls the pool back from inside `validate-stake!`, which pox-5
# invokes mid-`register-for-bond`. Written for this project rather than
# vendored: no real manager does this, and the point is that the trait does not
# stop one. See fastpool/sbtc-pool-bond-staker#1. Deployed after `bond-staker`,
# which it calls.
[contracts.callback-signer-manager]
path = "tests/contracts/callback-signer-manager.clar"
clarity_version = 6
epoch = "4.0"
